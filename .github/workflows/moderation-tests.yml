name: moderation-tests

on:
  push:
    paths:
      - "services/moderation/**"
      - ".github/workflows/moderation-tests.yml"
  pull_request:
    paths:
      - "services/moderation/**"
      - ".github/workflows/moderation-tests.yml"

jobs:
  pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/moderation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e .
      - name: Run US-MOD-03 DoD tests
        run: |
          python -m pytest -q \
            tests/test_mod03_approve.py \
            -k "approve_transitions_to_moderated_and_emits_event or approve_others_card_returns_403 or approve_after_edited_returns_409 or approve_without_sku_returns_409"
      - name: Run full Moderation suite
        run: python -m pytest -q
