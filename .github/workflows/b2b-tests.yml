name: b2b-tests

on:
  push:
    paths:
      - "services/b2b/**"
      - ".github/workflows/b2b-tests.yml"
  pull_request:
    paths:
      - "services/b2b/**"
      - ".github/workflows/b2b-tests.yml"

jobs:
  pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/b2b
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e .
      - name: Run US-B2B-01 DoD tests
        run: |
          python -m pytest -q \
            tests/test_us_b2b_01_create_product.py \
            -k "create_product_returns_201_with_created_status or seller_id_taken_from_jwt or missing_images_returns_400 or missing_category_returns_400 or invalid_category_id_returns_400"
      - name: Run US-B2B-02 DoD tests
        run: |
          python -m pytest -q \
            tests/test_us_b2b_02_create_sku.py \
            -k "first_sku_transitions_product_to_on_moderation or first_sku_emits_created_event_to_moderation or second_sku_no_state_change or add_sku_to_hard_blocked_returns_403 or missing_image_returns_400"
      - name: Run US-B2B-05 DoD tests
        run: |
          python -m pytest -q \
            tests/test_us_b2b_05_get_product.py \
            -k "get_moderated_product_returns_full_payload or get_blocked_product_returns_blocking_reason_and_field_reports or get_others_product_returns_404 or get_nonexistent_returns_404"
      - name: Run US-B2B-07 DoD tests
        run: |
          python -m pytest -q \
            tests/test_us_b2b_07_public_catalog.py \
            -k "catalog_returns_moderated_in_stock_products or catalog_excludes_hard_blocked or catalog_missing_service_key_returns_401 or catalog_response_has_no_cost_price or batch_ids_returns_visible_subset"
      - name: Run US-B2B-08 DoD tests
        run: |
          python -m pytest -q \
            tests/test_us_b2b_08_inventory.py \
            -k "reserve_all_skus_succeeds or partial_insufficient_stock_returns_409_all_rollback or idempotent_reserve_returns_200_without_double_deduction or sku_out_of_stock_event_emitted or unreserve_restores_quantities"
      - name: Run US-B2B-09 DoD tests
        run: |
          python -m pytest -q \
            tests/test_us_b2b_09_moderation_events.py \
            -k "moderated_event_clears_blocking_data or blocked_soft_saves_field_reports or blocked_hard_sets_terminal_status or hard_blocked_product_rejects_seller_edits or duplicate_event_same_idempotency_key_no_side_effects or missing_service_key_returns_401"
      - name: Run full B2B suite
        run: python -m pytest -q
