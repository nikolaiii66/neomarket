name: b2c-tests

on:
  push:
    paths:
      - "services/b2c/**"
      - ".github/workflows/b2c-tests.yml"
  pull_request:
    paths:
      - "services/b2c/**"
      - ".github/workflows/b2c-tests.yml"

jobs:
  pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/b2c
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e .
      - name: Run US-CART-03 DoD tests
        run: |
          python -m pytest -q \
            tests/test_us_cart_03_cart.py \
            -k "add_sku_increments_quantity_if_already_in_cart or get_cart_enriched_with_b2b_data or unavailable_sku_shown_with_reason or guest_cart_merged_on_login"
      - name: Run US-CAT-01 DoD tests
        run: |
          python -m pytest -q \
            tests/test_us_cat_01_catalog.py \
            -k "catalog_returns_filtered_sorted_products or facets_return_counts_per_filter_value or invalid_sort_returns_400 or b2b_unavailable_returns_502"
      - name: Run US-CAT-03 DoD tests
        run: |
          python -m pytest -q \
            tests/test_us_cat_03_product_card.py \
            -k "product_card_returns_full_data_with_skus or cost_price_absent_in_response or blocked_product_returns_404 or sku_without_stock_is_shown_as_unavailable"
      - name: Run full B2C suite
        run: python -m pytest -q
